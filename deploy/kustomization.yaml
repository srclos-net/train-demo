# Deploy layer for Argo CD (Application in deploy/argocd.yaml; path=deploy).
# CI pins image tags here after every push to main (see .github/scripts).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - kiosk.yaml
  - load-generator.yaml
  - load-ui.yaml
  - sso.yaml
  - ingress.yaml
images:
  - name: ghcr.io/srclos-net/train-demo-kiosk
    newTag: sha-2aaaf27
  - name: ghcr.io/srclos-net/train-demo-load-generator
    newTag: sha-2aaaf27
  - name: ghcr.io/srclos-net/train-demo-load-ui
    newTag: sha-2aaaf27
