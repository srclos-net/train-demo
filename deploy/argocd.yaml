apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: train-demo
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/srclos-net/train-demo.git
    targetRevision: master
    path: deploy
  destination:
    server: https://kubernetes.default.svc
    namespace: trains
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
