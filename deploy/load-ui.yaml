# load-ui: control panel for regional fault injection; its nginx proxies
# /api -> load-generator:3001 (in-cluster, no external exposure of the api).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: load-ui
  namespace: trains
  labels:
    app.kubernetes.io/name: load-ui
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: load-ui
  template:
    metadata:
      labels:
        app.kubernetes.io/name: load-ui
    spec:
      containers:
        - name: load-ui
          image: ghcr.io/srclos-net/train-demo-load-ui
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
---
apiVersion: v1
kind: Service
metadata:
  name: load-ui
  namespace: trains
spec:
  selector:
    app.kubernetes.io/name: load-ui
  ports:
    - port: 80
      targetPort: 80
